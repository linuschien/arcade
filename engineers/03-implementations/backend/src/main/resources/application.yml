server:
  port: 8080

arcade:
  guest-email: guest@arcade-stadium.local
  admin-emails:
    - linus.chien@gmail.com

spring:
  application:
    name: arcade-backend

  r2dbc:
    url: r2dbc:h2:mem:///arcadedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    properties:
      schema: public

  datasource:
    url: jdbc:h2:mem:arcadedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    cors:
      allowed-origins: "*"

  web:
    resources:
      static-locations: file:../frontend/dist,classpath:/static/

logging:
  level:
    root: INFO
    com.arcade.stadium: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.graphql: DEBUG
