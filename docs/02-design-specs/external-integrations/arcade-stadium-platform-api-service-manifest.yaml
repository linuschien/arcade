service_name: "arcade-stadium-platform-api"
architecture: "Hexagonal"
adapters:
  - name: "PlayerRestControllerAdapter"
    type: "Primary"
    tech: "Spring WebFlux + Reactor Netty"
    stereotype: "<<RestController>>"
    port:
      interface: "PlayerCommandService"
      layer: "domain.ports.input"
  - name: "UserWalletRestControllerAdapter"
    type: "Primary"
    tech: "Spring WebFlux + Reactor Netty"
    stereotype: "<<RestController>>"
    port:
      interface: "UserWalletCommandService"
      layer: "domain.ports.input"
  - name: "GameCardRestControllerAdapter"
    type: "Primary"
    tech: "Spring WebFlux + Reactor Netty"
    stereotype: "<<RestController>>"
    port:
      interface: "GameCardCommandService"
      layer: "domain.ports.input"
  - name: "LeaderboardEntryRestControllerAdapter"
    type: "Primary"
    tech: "Spring WebFlux + Reactor Netty"
    stereotype: "<<RestController>>"
    port:
      interface: "LeaderboardEntryCommandService"
      layer: "domain.ports.input"
  - name: "PlayerGraphQLResolverAdapter"
    type: "Primary"
    tech: "Spring for GraphQL + Reactor Netty"
    stereotype: "<<GraphQLResolver>>"
    port:
      interface: "PlayerQueryService"
      layer: "domain.ports.input"
  - name: "UserWalletGraphQLResolverAdapter"
    type: "Primary"
    tech: "Spring for GraphQL + Reactor Netty"
    stereotype: "<<GraphQLResolver>>"
    port:
      interface: "UserWalletQueryService"
      layer: "domain.ports.input"
  - name: "GameCardGraphQLResolverAdapter"
    type: "Primary"
    tech: "Spring for GraphQL + Reactor Netty"
    stereotype: "<<GraphQLResolver>>"
    port:
      interface: "GameCardQueryService"
      layer: "domain.ports.input"
  - name: "LeaderboardEntryGraphQLResolverAdapter"
    type: "Primary"
    tech: "Spring for GraphQL + Reactor Netty"
    stereotype: "<<GraphQLResolver>>"
    port:
      interface: "LeaderboardEntryQueryService"
      layer: "domain.ports.input"
  - name: "PlayerRepositoryAdapter"
    type: "Secondary"
    tech: "Spring Data R2DBC (H2)"
    stereotype: "<<Repository>>"
    port:
      interface: "PlayerRepository"
      layer: "domain.ports.output"
  - name: "UserWalletRepositoryAdapter"
    type: "Secondary"
    tech: "Spring Data R2DBC (H2)"
    stereotype: "<<Repository>>"
    port:
      interface: "UserWalletRepository"
      layer: "domain.ports.output"
  - name: "GameCardRepositoryAdapter"
    type: "Secondary"
    tech: "Spring Data R2DBC (H2)"
    stereotype: "<<Repository>>"
    port:
      interface: "GameCardRepository"
      layer: "domain.ports.output"
  - name: "LeaderboardEntryRepositoryAdapter"
    type: "Secondary"
    tech: "Spring Data R2DBC (H2)"
    stereotype: "<<Repository>>"
    port:
      interface: "LeaderboardEntryRepository"
      layer: "domain.ports.output"
